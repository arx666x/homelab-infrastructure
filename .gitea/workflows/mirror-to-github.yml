name: Mirror to GitHub (Backup)

# Mirrors every push (any branch, any author — including upgrade-agent's
# autonomous commits) from Gitea to the personal GitHub backup.
# Gitea is authoritative; GitHub is a pure backup and never written to
# independently, so --mirror (force, includes deletes) is safe here.
#
# No actions/checkout here on purpose: the act_runner:nightly image has no
# `node` binary and runner labels run host:// (see docs/upgrades/gitea-actions-runner.md),
# so JS-based actions fail with "Cannot find: node in PATH". Plain `git clone`
# in a run: step avoids that entirely — same pattern as mirror-to-sailpoint.yml
# in prism/erp-portal/seri-k8s/trakkws-quarkus (docs/gitea-sailpoint-mirror-runbook.md).

on:
  push:
    branches:
      - '**'
  delete: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to GitHub (arx666x, backup)
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          REPO_NAME: ${{ gitea.repository }}
          SERVER_URL: ${{ gitea.server_url }}
        run: |
          git clone --mirror \
            "https://gitea-actions:${GITEA_TOKEN}@${SERVER_URL#https://}/${REPO_NAME}.git" repo
          cd repo
          git push --mirror \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/arx666x/homelab-infrastructure.git"

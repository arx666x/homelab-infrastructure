---
# dns-exporters.yml
# Deploys node_exporter and keepalived_exporter to DNS nodes (dns01, later dns02).
#
# DNS nodes sit outside the k3s cluster (own [dns] inventory group), so they
# never get node-exporter via the kube-prometheus-stack DaemonSet - these are
# standalone systemd services, scraped by Prometheus via additionalScrapeConfigs
# static targets (see gitops/apps/monitoring.yaml).
#
# node_exporter also gets --collector.textfile.directory enabled, so the
# os-update-check.yml playbook (apt updates pending, reboot-required) can
# expose its metrics the same way as on k3s nodes.
#
# keepalived_exporter reads VRRP state via SIGDATA to /tmp/keepalived.data,
# so it needs to run as root - no special keepalived compile flags required.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini playbooks/dns-exporters.yml
#   ansible-playbook -i inventory/hosts.ini playbooks/dns-exporters.yml --tags remove

- name: Deploy node_exporter + keepalived_exporter to DNS nodes
  hosts: dns
  become: true
  gather_facts: true

  vars:
    node_exporter_version: "1.12.1"
    node_exporter_arch_map:
      aarch64: arm64
      x86_64: amd64
    node_exporter_arch: "{{ node_exporter_arch_map[ansible_facts['architecture']] }}"
    node_exporter_checksums:
      arm64: "ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"
      amd64: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
    textfile_collector_dir: /var/lib/node_exporter/textfile_collector

    keepalived_exporter_version: "1.7.1"
    # arm64 build only - dns nodes are Raspberry Pi. Checksum computed locally
    # from the release asset (upstream doesn't publish a checksums file).
    keepalived_exporter_arm64_checksum: "sha256:943fe4a526356881fa08dd1039a1eb547250d7d7522b9ace4a2cb16807f144ba"

  tasks:

    # -------------------------------------------------------------------------
    # node_exporter
    # -------------------------------------------------------------------------

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: [install, node-exporter]

    - name: Download node_exporter release
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        checksum: "sha256:{{ node_exporter_checksums[node_exporter_arch] }}"
        mode: "0644"
      tags: [install, node-exporter]

    - name: Extract node_exporter binary
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
      tags: [install, node-exporter]

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Reload systemd and restart node_exporter
      tags: [install, node-exporter]

    - name: Create textfile collector directory
      ansible.builtin.file:
        path: "{{ textfile_collector_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [install, node-exporter]

    - name: Deploy node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus node_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter \
            --collector.textfile.directory={{ textfile_collector_dir }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd and restart node_exporter
      tags: [install, node-exporter]

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true
      tags: [install, node-exporter]

    # -------------------------------------------------------------------------
    # keepalived_exporter
    # -------------------------------------------------------------------------

    - name: Download keepalived_exporter .deb
      ansible.builtin.get_url:
        url: "https://github.com/mehdy/keepalived-exporter/releases/download/v{{ keepalived_exporter_version }}/keepalived-exporter_{{ keepalived_exporter_version }}_linux_arm64.deb"
        dest: "/tmp/keepalived-exporter_{{ keepalived_exporter_version }}_linux_arm64.deb"
        checksum: "{{ keepalived_exporter_arm64_checksum }}"
        mode: "0644"
      when: ansible_facts['architecture'] == 'aarch64'
      tags: [install, keepalived-exporter]

    - name: Install keepalived_exporter package
      ansible.builtin.apt:
        deb: "/tmp/keepalived-exporter_{{ keepalived_exporter_version }}_linux_arm64.deb"
      when: ansible_facts['architecture'] == 'aarch64'
      tags: [install, keepalived-exporter]

    - name: Deploy keepalived_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/keepalived_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus keepalived_exporter
          After=network-online.target keepalived.service
          Wants=network-online.target

          [Service]
          # Needs root: sends SIGDATA/SIGSTATS to keepalived and reads /tmp/keepalived.data
          User=root
          Type=simple
          ExecStart=/usr/bin/keepalived-exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd and restart keepalived_exporter
      tags: [install, keepalived-exporter]

    - name: Enable and start keepalived_exporter
      ansible.builtin.systemd:
        name: keepalived_exporter
        enabled: true
        state: started
        daemon_reload: true
      tags: [install, keepalived-exporter]

    # -------------------------------------------------------------------------
    # Remove (--tags remove)
    # -------------------------------------------------------------------------

    - name: Stop and disable exporters
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - node_exporter
        - keepalived_exporter
      ignore_errors: true
      tags: [never, remove]

    - name: Remove exporter files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/node_exporter.service
        - /etc/systemd/system/keepalived_exporter.service
        - /usr/local/bin/node_exporter
      tags: [never, remove]

    - name: Reload systemd after removal
      ansible.builtin.systemd:
        daemon_reload: true
      tags: [never, remove]

  handlers:
    - name: Reload systemd and restart node_exporter
      ansible.builtin.systemd:
        daemon_reload: true
        name: node_exporter
        state: restarted

    - name: Reload systemd and restart keepalived_exporter
      ansible.builtin.systemd:
        daemon_reload: true
        name: keepalived_exporter
        state: restarted

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@git.reckeweg.io:achim/homelab-infrastructure.git
    targetRevision: HEAD
    path: gitops/config/homeassistant
  destination:
    server: https://kubernetes.default.svc
    namespace: homeassistant
  syncPolicy:
    # 2026-09-01: Automatik abgeschaltet fuer den Umzug auf die diskstation.
    # selfHeal wuerde das Deployment wieder hochziehen und damit eine zweite
    # Home-Assistant-Instanz gegen dieselbe PostgreSQL laufen lassen.
    # Zum Reaktivieren (Rueckweg in den Cluster): Block einkommentieren und
    # replicas in gitops/config/homeassistant/deployment.yaml auf 1 setzen.
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

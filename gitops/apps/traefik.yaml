apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.3.2
    helm:
      releaseName: traefik
      values: |
        service:
          annotations:
            metallb.universe.tf/address-pool: default-pool
          # Chart >= 42.3.1: Schema erlaubt kein service.type mehr, Service-Spec-Felder liegen unter service.spec
          spec:
            type: LoadBalancer

        ports:
          web:
            port: 80
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 443

        ingressClass:
          enabled: true
          isDefaultClass: true

        core:
          defaultRuleSyntax: v2

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 2m


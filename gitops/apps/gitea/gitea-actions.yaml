apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: actions
    repoURL: https://dl.gitea.com/charts/
    targetRevision: 0.1.0
    helm:
      releaseName: gitea-actions
      valuesObject:
        enabled: true
        existingSecret: gitea-actions-secret
        existingSecretKey: token
        giteaRootURL: https://gitea.reckeweg.io
        global:
          storageClass: longhorn
        statefulset:
          replicas: 1
          timezone: Europe/Berlin
          persistence:
            size: 1Gi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          dind:
            extraEnvs:
              - name: DOCKER_IPTABLES_LEGACY
                value: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 2m

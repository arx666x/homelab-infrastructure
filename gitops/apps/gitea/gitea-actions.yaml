apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - chart: actions
      repoURL: https://dl.gitea.com/charts/
      targetRevision: 0.1.1
      helm:
        releaseName: gitea-actions
        valueFiles:
          - $values/gitops/config/gitea-actions/values.yaml
    - repoURL: git@git.reckeweg.io:achim/homelab-infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 2m

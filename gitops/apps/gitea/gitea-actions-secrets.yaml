apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@git.reckeweg.io:achim/homelab-infrastructure.git
    targetRevision: main
    path: gitops/config/gitea/actions
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

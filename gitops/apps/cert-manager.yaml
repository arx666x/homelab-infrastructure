apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # cert-manager Helm Chart
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.21.0
      helm:
        releaseName: cert-manager
        values: |
          installCRDs: true
          # DNS-01-Selfcheck direkt gegen öffentliche Resolver statt über die
          # Cluster-Default-Route (CoreDNS -> Node-resolv.conf -> Pi-hole).
          # Pi-hole cached sonst negative Antworten für frisch angelegte
          # _acme-challenge-TXT-Records und blockiert die Propagation-Prüfung
          # weit über die eigentliche SOA-Negative-TTL hinaus (beobachtet:
          # >2h Stillstand bei einem Wildcard-Cert, obwohl der Record über
          # öffentliche Resolver und die autoritativen Cloudflare-NS längst
          # sichtbar war).
          extraArgs:
            - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
            - --dns01-recursive-nameservers-only=true
    
    # ClusterIssuer Config aus Git
    - repoURL: git@git.reckeweg.io:achim/homelab-infrastructure.git
      targetRevision: main
      path: gitops/config/cert-manager
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 2m
  
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
        - /status
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

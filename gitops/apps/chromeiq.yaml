apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chromeiq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@git.reckeweg.io:achim/homelab-infrastructure.git
    targetRevision: HEAD
    path: gitops/config/chromeiq
  destination:
    server: https://kubernetes.default.svc
    namespace: chromeiq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    # Kubernetes echoes apiVersion/kind/volumeMode/status into the embedded PVC
    # template on the live StatefulSet - not in git, not a real diff, but keeps
    # the app permanently OutOfSync in the ArgoCD UI without this.
    - group: apps
      kind: StatefulSet
      name: chromeiq-postgresql
      namespace: chromeiq
      jsonPointers:
        - /spec/volumeClaimTemplates

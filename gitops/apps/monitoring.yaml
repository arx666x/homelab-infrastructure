apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "88.5.4"
    helm:
      releaseName: kube-prometheus-stack
      skipCrds: false
      values: |
        # k3s-spezifische Default Rules deaktivieren
        # k3s hat kein separates kube-proxy, kube-scheduler, kube-controller-manager
        defaultRules:
          rules:
            kubeScheduler: false
            kubeControllerManager: false
            kubeProxy: false
          disabled:
            KubeSchedulerDown: true
            KubeControllerManagerDown: true
            KubeProxyDown: true

        # node-exporter textfile collector: os-update-check.yml (Ansible) writes
        # pending-update / reboot-required metrics into this hostPath on every
        # k3s node; mount it read-only into the DaemonSet so node-exporter picks
        # them up alongside the built-in collectors.
        prometheus-node-exporter:
          extraArgs:
            - --collector.textfile.directory=/host/textfile_collector
          extraHostVolumeMounts:
            - name: textfile-collector
              hostPath: /var/lib/node_exporter/textfile_collector
              mountPath: /host/textfile_collector
              readOnly: true

        prometheus:
          prometheusSpec:
            retention: 14d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  resources:
                    requests:
                      storage: 50Gi

            # DNS nodes (dns01, later dns02) live outside the k3s cluster - own
            # [dns] Ansible inventory group - so they never get scraped via the
            # node-exporter DaemonSet or any ServiceMonitor. Scrape them as
            # static targets instead. Exporters are deployed by
            # ansible/playbooks/dns-exporters.yml.
            additionalScrapeConfigs:
              - job_name: dns-node-exporter
                static_configs:
                  - targets:
                      - 192.168.11.57:9100   # dns01
                    labels:
                      node: dns01
              - job_name: dns-keepalived-exporter
                static_configs:
                  - targets:
                      - 192.168.11.57:9165   # dns01
                    labels:
                      node: dns01

          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.reckeweg.io
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.reckeweg.io
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              # Authentik ForwardAuth-Gate - Prometheus hat kein eigenes Login.
              # Braucht zusaetzlich die ungegatete Outpost-Passthrough-Route,
              # siehe gitops/config/authentik/outpost-passthrough-ingressroute.yaml
              traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forward-auth@kubernetescrd

        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          # Natives OIDC gegen Authentik, zusaetzlich zum bestehenden
          # Admin-Login (admin.existingSecret bleibt als Fallback aktiv,
          # falls Authentik mal nicht erreichbar ist). role_attribute_path
          # nutzt den groups-Claim - Gruppe "grafana-admins" in Authentik
          # muss noch angelegt werden, sonst landen alle OIDC-User als Viewer.
          grafana.ini:
            server:
              # Ohne root_url baut Grafana die OAuth-redirect_uri mit dem
              # Default http://localhost:3000/... statt der echten externen
              # URL - landet nirgendwo, Login-Button bounct kommentarlos
              # zurueck, bevor Authentik ueberhaupt einen Request sieht
              # (live bestaetigt am 2026-07-26: keine /application/o/authorize/
              # Requests in den Authentik-Logs trotz Login-Versuchen).
              root_url: https://grafana.reckeweg.io/
            auth.generic_oauth:
              enabled: true
              name: Authentik
              client_id: grafana
              scopes: "openid profile email"
              auth_url: https://sso.reckeweg.io/application/o/authorize/
              token_url: https://sso.reckeweg.io/application/o/token/
              api_url: https://sso.reckeweg.io/application/o/userinfo/
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: client_secret
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 10Gi
          deploymentStrategy:
            type: Recreate
          
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.reckeweg.io
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.reckeweg.io
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure

        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-credentials
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  resources:
                    requests:
                      storage: 10Gi

          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: 'smtp.gmail.com:587'
              smtp_from: 'achim.reckeweg@gmail.com'
              smtp_auth_username: 'achim.reckeweg@gmail.com'
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-credentials/gmail-password
              smtp_require_tls: true

            route:
              group_by: ['alertname', 'node', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: telegram
              routes:
                - receiver: telegram-and-email
                  matchers:
                    - severity = critical
                  continue: false
                - receiver: telegram
                  matchers:
                    - severity = warning
                  continue: false

            receivers:
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-credentials/telegram-bot-token
                    chat_id: 8677165142
                    parse_mode: HTML
                    message: |
                      {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
                      {{ range .Alerts }}
                      📍 {{ .Annotations.summary }}
                      {{ if .Annotations.description }}ℹ️ {{ .Annotations.description }}{{ end }}
                      🕐 {{ .StartsAt.Format "15:04:05" }}
                      {{ end }}

              - name: email
                email_configs:
                  - to: 'achim.reckeweg@gmail.com'
                    send_resolved: true
                    headers:
                      Subject: '[Homelab] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'

              - name: telegram-and-email
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-credentials/telegram-bot-token
                    chat_id: 8677165142
                    parse_mode: HTML
                    message: |
                      {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
                      {{ range .Alerts }}
                      📍 {{ .Annotations.summary }}
                      {{ if .Annotations.description }}ℹ️ {{ .Annotations.description }}{{ end }}
                      🕐 {{ .StartsAt.Format "15:04:05" }}
                      {{ end }}
                email_configs:
                  - to: 'achim.reckeweg@gmail.com'
                    send_resolved: true
                    headers:
                      Subject: '[Homelab] 🔴 {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'

            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity = warning
                equal: ['alertname', 'node']

        additionalPrometheusRulesMap:
          homelab-rules:
            groups:
              - name: nodes
                interval: 1m
                rules:
                  - alert: NodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node {{ $labels.node }} ist nicht Ready"
                      description: "Node {{ $labels.node }} meldet seit 5 Minuten NotReady. Bitte pruefen!"

                  - alert: NodeMemoryPressure
                    expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Memory Pressure auf Node {{ $labels.node }}"
                      description: "Node {{ $labels.node }} hat Memory Pressure. Pods koennen nicht mehr scheduled werden."

                  - alert: NodeDiskPressure
                    expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Disk Pressure auf Node {{ $labels.node }}"
                      description: "Node {{ $labels.node }} hat Disk Pressure. Speicher pruefen!"

                  - alert: NodeHighMemoryUsage
                    expr: |
                      (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Hoher RAM-Verbrauch auf {{ $labels.instance }}"
                      description: "{{ $labels.instance }} hat {{ $value | humanize }}% RAM Auslastung."

              - name: pods
                interval: 1m
                rules:
                  - alert: PodCrashLooping
                    expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crashloopt"
                      description: "Container {{ $labels.container }} hat mehr als 3 Restarts in 15 Minuten."

                  - alert: PodNotReady
                    expr: |
                      kube_pod_status_ready{condition="true"} == 0
                      and kube_pod_status_phase{phase=~"Pending|Running"} == 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} nicht Ready"
                      description: "Pod laeuft seit mehr als 10 Minuten aber ist nicht Ready."

                  - alert: PodOOMKilled
                    expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                    for: 0m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} durch OOM gekillt"
                      description: "Container {{ $labels.container }} wurde wegen Out-of-Memory beendet."

              - name: longhorn
                interval: 1m
                rules:
                  - alert: LonghornVolumeUnhealthy
                    expr: longhorn_volume_robustness == 3
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Longhorn Volume {{ $labels.volume }} ist unhealthy"
                      description: "Volume {{ $labels.volume }} hat Robustness-Status 'faulted'. Sofort pruefen!"

                  - alert: LonghornVolumeDegraded
                    expr: longhorn_volume_robustness == 2
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Longhorn Volume {{ $labels.volume }} ist degradiert"
                      description: "Volume {{ $labels.volume }} laeuft ohne vollstaendige Replikation."

                  - alert: LonghornNodeDown
                    expr: longhorn_node_status{condition="ready"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Longhorn Node {{ $labels.node }} ist down"
                      description: "Longhorn kann Node {{ $labels.node }} nicht erreichen."

                  - alert: LonghornDiskAlmostFull
                    expr: |
                      (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 85
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Longhorn Disk auf {{ $labels.node }} fast voll"
                      description: "Disk {{ $labels.disk }} auf {{ $labels.node }} ist zu {{ $value | humanize }}% voll."

              - name: k3s
                interval: 1m
                rules:
                  - alert: K3sAgentDown
                    expr: up{job="kubelet"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "k3s Agent auf {{ $labels.node }} nicht erreichbar"
                      description: "Der kubelet auf Node {{ $labels.node }} antwortet nicht mehr."

              # node_os_updates_pending / node_os_reboot_required kommen vom
              # textfile collector (siehe ansible/playbooks/os-update-check.yml).
              # Gilt fuer k3s-Nodes UND die DNS-Nodes (dns01, spaeter dns02).
              - name: updates
                interval: 1h
                rules:
                  - alert: OSUpdatesPending
                    expr: node_os_updates_pending > 0
                    for: 3d
                    labels:
                      severity: warning
                    annotations:
                      summary: "Ausstehende Updates auf {{ $labels.instance }}"
                      description: "{{ $labels.instance }} hat seit 3 Tagen {{ $value }} ausstehende Paket-Updates."

                  - alert: OSRebootRequired
                    expr: node_os_reboot_required == 1
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Reboot erforderlich auf {{ $labels.instance }}"
                      description: "{{ $labels.instance }} meldet seit 1 Stunde /var/run/reboot-required."

              # DNS-Nodes (dns01, spaeter dns02) liegen ausserhalb des k3s-Clusters
              # und werden ueber additionalScrapeConfigs als static targets erfasst
              # (siehe prometheus.prometheusSpec.additionalScrapeConfigs oben).
              - name: dns
                interval: 1m
                rules:
                  - alert: DnsNodeDown
                    expr: up{job="dns-node-exporter"} == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "DNS-Node {{ $labels.node }} nicht erreichbar"
                      description: "node_exporter auf {{ $labels.node }} antwortet seit 2 Minuten nicht mehr - Pi-hole/DNS fuer das gesamte Netz koennte betroffen sein."

                  - alert: KeepalivedExporterDown
                    expr: up{job="dns-keepalived-exporter"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "keepalived_exporter auf {{ $labels.node }} nicht erreichbar"
                      description: "keepalived_exporter auf {{ $labels.node }} antwortet seit 5 Minuten nicht mehr. Sagt nichts ueber den VRRP-Status selbst aus, nur ueber das Monitoring dafuer."

                  # pihole_blocking_enabled kommt vom textfile collector
                  # (siehe ansible/playbooks/pihole-metrics.yml), nicht aus
                  # dem dns-node-exporter Scrape-Target direkt.
                  - alert: PiholeBlockingDisabled
                    expr: pihole_blocking_enabled == 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pi-hole Blocking auf {{ $labels.instance }} deaktiviert"
                      description: "Pi-hole blockiert seit 15 Minuten keine Anfragen mehr - falls das nicht absichtlich (Troubleshooting) ist, wieder aktivieren."

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true 
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 10m
  
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
        - /status
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
    - group: monitoring.coreos.com
      kind: PrometheusRule
      name: kube-prometheus-stack-kubernetes-system-controller-manager
      namespace: monitoring
      jsonPointers:
        - /spec
    - group: monitoring.coreos.com
      kind: PrometheusRule
      name: kube-prometheus-stack-kubernetes-system-scheduler
      namespace: monitoring
      jsonPointers:
        - /spec
    - group: monitoring.coreos.com
      kind: PrometheusRule
      name: kube-prometheus-stack-kubernetes-system-kube-proxy
      namespace: monitoring
      jsonPointers:
        - /spec
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources

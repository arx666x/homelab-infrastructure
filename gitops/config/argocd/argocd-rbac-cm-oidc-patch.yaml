# =============================================================================
# ArgoCD - RBAC fuer OIDC-Login
#
# argocd-rbac-cm existiert bereits, ist aber leer (kein data:-Key gesetzt,
# reiner install.yaml-Stub) - hier also kein Risiko wie bei argocd-cm, es
# gibt nichts Bestehendes zu ueberschreiben. Trotzdem ServerSideApply=true
# ueber dieselbe argocd-config-Application (siehe argocd-cm-oidc-patch.yaml).
#
# Subject in der g-Zeile ist der "email"-Claim aus dem Authentik-Token
# (property_mappings im Blueprint enthalten scope-email) - anpassen, falls
# eine andere Mail-Adresse als Login-Identitaet genutzt werden soll.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    g, achim.reckeweg@gmail.com, role:admin

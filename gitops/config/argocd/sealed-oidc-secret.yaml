---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc-secret
  namespace: argocd
spec:
  encryptedData:
    client_secret: 
  template:
    metadata:
      name: argocd-oidc-secret
      namespace: argocd
      # Noetig, damit argocd-cm den Wert per $argocd-oidc-secret:client_secret
      # referenzieren kann - ArgoCD liest nur Secrets mit diesem Label ein.
      labels:
        app.kubernetes.io/part-of: argocd

# =============================================================================
# ArgoCD - argocd-cm, vollstaendig deklariert (NICHT nur ein Patch)
#
# War urspruenglich als reiner oidc.config/url-"Patch" gedacht, unter der
# Annahme, ServerSideApply=true auf der argocd-config-Application wuerde
# reichen, um die bestehenden resource.customizations.*-Keys unangetastet
# zu lassen. Live widerlegt am 2026-07-26: ein direktes
# `kubectl apply -f` (ohne --server-side, zum schnellen Testen benutzt)
# hat genau diese Keys geloescht - kubectl's client-side 3-Wege-Merge
# entfernt beim Apply automatisch alles, was in einer FRUEHEREN
# last-applied-configuration stand, aber nicht in der neuen Datei ist.
# Die urspruengliche last-applied-configuration (siehe Backup von vor
# diesem Vorfall) zeigt, dass diese Keys selbst per `kubectl apply`
# gesetzt wurden - nicht per `kubectl patch` wie in scripts/install-argocd.sh
# dokumentiert.
#
# Deshalb jetzt ALLE Keys hier deklariert, nicht nur die neuen - das ist
# robust gegen sowohl SSA (ArgoCD-Sync) als auch versehentliches
# client-side `kubectl apply`, weil in beiden Faellen der volle
# gewuenschte Zustand im File steht statt in einer stillen Annahme ueber
# "was schon da ist". Quelle der urspruenglichen Werte: Live-Backup
# (kubectl get cm argocd-cm -o yaml) von vor der OIDC-Aenderung.
#
# clientSecret referenziert gitops/config/argocd/sealed-oidc-secret.yaml -
# ArgoCD liest per $<secretname>:<key>-Syntax jedes Secret mit dem Label
# app.kubernetes.io/part-of=argocd ein (siehe dortiges Label).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  application.resourceTrackingMethod: annotation

  # Eigene externe Basis-URL - ohne das konstruiert ArgoCD die
  # OIDC-redirect_uri aus dem eingehenden Request, der intern als HTTP
  # ankommt (Traefik terminiert TLS, ArgoCD laeuft --insecure, siehe
  # docs/NETWORK-GUIDE.md) - Ergebnis waere http://argocd.reckeweg.io/...
  # statt https://..., was Authentiks strikte redirect_uri-Pruefung ablehnt
  # ("Invalid redirect URL: the protocol and host ... must match", live
  # bestaetigt am 2026-07-26).
  url: https://argocd.reckeweg.io

  oidc.config: |
    name: Authentik
    issuer: https://sso.reckeweg.io/application/o/argocd/
    clientID: argocd
    clientSecret: $argocd-oidc-secret:client_secret
    requestedScopes:
      - openid
      - profile
      - email

  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ingress is healthy"
    return hs
  resource.customizations.ignoreResourceUpdates.ConfigMap: |
    jqPathExpressions:
      # Ignore the cluster-autoscaler status
      - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
      # Ignore the annotation of the legacy Leases election
      - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
  resource.customizations.ignoreResourceUpdates.Endpoints: |
    jsonPointers:
      - /metadata
      - /subsets
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers:
      - /status
  resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
    jqPathExpressions:
      - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
      - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
      - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
      - '.metadata.annotations."argocd.argoproj.io/refresh"'
      - '.metadata.annotations."argocd.argoproj.io/hydrate"'
      - '.operation'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
  resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
    jqPathExpressions:
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
  resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
    jsonPointers:
      - /metadata
      - /endpoints
      - /ports
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest

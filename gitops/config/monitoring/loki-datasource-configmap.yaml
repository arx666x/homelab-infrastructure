apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-stack
  namespace: monitoring
  labels:
    app: loki-stack
    grafana_datasource: "1"
data:
  loki-stack-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: "http://loki-stack.monitoring.svc.cluster.local:3100"
      version: 1
      isDefault: false
      jsonData:
        maxLines: 1000

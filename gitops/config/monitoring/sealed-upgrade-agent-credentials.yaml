# Sealed Secret for upgrade-agent-credentials
#
# To (re-)generate this file:
#
#   kubectl create secret generic upgrade-agent-credentials \
#     --namespace monitoring \
#     --from-literal=anthropic-api-key='sk-ant-...' \
#     --from-literal=gitea-token='...' \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml \
#   > gitops/config/monitoring/sealed-upgrade-agent-credentials.yaml
#
# Then commit and push — ArgoCD will apply the SealedSecret automatically.
#
# NOTE: Telegram bot token and Gmail password are already sealed in
#       alertmanager-credentials — no duplication needed here.
#
# PLACEHOLDER — replace with actual sealed output from kubeseal:
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: upgrade-agent-credentials
  namespace: monitoring
spec:
  encryptedData:
    anthropic-api-key: REPLACE_WITH_KUBESEAL_OUTPUT
    gitea-token: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: upgrade-agent-credentials
      namespace: monitoring

---
# ============================================================
# homelab-version-checker v3
# Prüft wöchentlich:
#   1. Alle ArgoCD Applications (Helm: Versionsvergleich, Git/Kustomize: Status)
#      Neue Apps werden automatisch erkannt – kein manuelles Mapping nötig
#   2. System-Komponenten via GitHub Releases: k3s, ArgoCD, KubeVirt, CDI
#   3. Docker Hub Images: Guacamole webapp + guacd
#
# Credentials: alertmanager-credentials Secret (gmail-password)
# Zeitplan: Montags 07:00 Uhr Europe/Berlin
# ============================================================

# ------------------------------------------------------------
# 1. ServiceAccount
# ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-version-checker
  namespace: monitoring

---
# ------------------------------------------------------------
# 2. ClusterRole
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-version-checker
rules:
  - apiGroups: [""]
    resources: ["secrets", "namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["kubevirts"]
    verbs: ["get", "list"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["cdis"]
    verbs: ["get", "list"]

---
# ------------------------------------------------------------
# 3. ClusterRoleBinding
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-version-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-version-checker
subjects:
  - kind: ServiceAccount
    name: homelab-version-checker
    namespace: monitoring

---
# ------------------------------------------------------------
# 4. ConfigMap – Python-Script v3
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-version-checker-script
  namespace: monitoring
data:
  check-versions.py: |
    #!/usr/bin/env python3
    """
    Homelab Version Checker v3
    - Liest alle ArgoCD Applications direkt via kubectl
    - Erkennt automatisch neue Apps (kein hardcodiertes Mapping nötig)
    - Helm Apps: vergleicht targetRevision mit neuster stabiler Version im Helm Repo
    - Git/Kustomize Apps: zeigt Sync/Health Status
    - GitHub-basierte Systemkomponenten: k3s, ArgoCD, KubeVirt, CDI
    - Docker Hub Images: Guacamole webapp + guacd
    """
    
    import subprocess, json, smtplib, sys, os, re
    import urllib.request, yaml, gzip
    from datetime import datetime
    from email.mime.multipart import MIMEMultipart
    from email.mime.text import MIMEText
    
    # ---------------------------------------------------------------------------
    SMTP_HOST      = os.getenv("SMTP_HOST", "smtp.gmail.com")
    SMTP_PORT      = int(os.getenv("SMTP_PORT", "587"))
    SMTP_FROM      = os.getenv("SMTP_FROM", "achim.reckeweg@gmail.com")
    SMTP_TO        = os.getenv("SMTP_TO",   "achim.reckeweg@gmail.com")
    GMAIL_PWD_FILE = os.getenv("GMAIL_PWD_FILE",
        "/etc/alertmanager/secrets/alertmanager-credentials/gmail-password")
    
    # Reine Config-Apps ohne eigene Version – nur Status anzeigen, kein Update-Check
    KUSTOMIZE_ONLY_APPS = {
        "argocd-config", "gitea-actions-secrets", "gitea-postgresql", "gitea-valkey",
        "grafana-dashboards-loki", "guacamole", "longhorn-backup", "monitoring-secrets",
        "root-infrastructure", "windows-ad", "gitea-actions-secrets",
    }
    
    # GitHub-basierte Systemkomponenten (außerhalb ArgoCD)
    GITHUB_COMPONENTS = {
        "k3s":      {"repo": "k3s-io/k3s",                          "get_version": "k3s_node_version",          "label": "k3s (Cluster)"},
        "argocd":   {"repo": "argoproj/argo-cd",                    "get_version": "argocd_deployment_version", "label": "ArgoCD (nicht via ArgoCD verwaltet)"},
        "kubevirt": {"repo": "kubevirt/kubevirt",                   "get_version": "kubevirt_cr_version",       "label": "KubeVirt"},
        "cdi":      {"repo": "kubevirt/containerized-data-importer","get_version": "cdi_cr_version",            "label": "CDI (Containerized Data Importer)"},
    }
    
    # Docker Hub Images
    DOCKERHUB_IMAGES = {
        "guacamole": {"image": "guacamole/guacamole", "label": "Guacamole (webapp)",      "namespace": "guacamole", "deployment": "guacamole", "container": "guacamole"},
        "guacd":     {"image": "guacamole/guacd",     "label": "Guacamole (guacd daemon)", "namespace": "guacamole", "deployment": "guacd",     "container": "guacd"},
    }
    
    # ---------------------------------------------------------------------------
    # Helpers
    # ---------------------------------------------------------------------------
    
    def run(cmd, silent=False):
        r = subprocess.run(cmd, capture_output=True, text=True)
        if r.returncode != 0 and not silent:
            print(f"[WARN] {' '.join(cmd)}: {r.stderr.strip()}", file=sys.stderr)
        return r.stdout.strip() or None
    
    
    def http_get(url, timeout=15):
        try:
            req = urllib.request.Request(url, headers={"User-Agent": "homelab-version-checker/3.0"})
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                raw = resp.read()
                if raw[:2] == b'\x1f\x8b':
                    raw = gzip.decompress(raw)
                return raw.decode("utf-8")
        except Exception as e:
            print(f"[WARN] GET {url}: {e}", file=sys.stderr)
            return None
    
    
    def semver_key(v):
        """Sortierbare Tuple aus Versionsstring. Ignoriert +suffix und führendes v."""
        v = re.sub(r'\+.*$', '', str(v).lstrip('v'))
        # Wildcard-Suffix entfernen (z.B. "3.12.*" → "3.12.0")
        v = v.replace('.*', '.0').replace('*', '0')
        parts = re.split(r'[.\-]', v)
        nums = []
        for p in parts[:3]:
            try:
                nums.append(int(p))
            except ValueError:
                nums.append(0)
        while len(nums) < 3:
            nums.append(0)
        return nums
    
    
    def is_wildcard(v):
        return '*' in str(v)
    
    
    def compare(installed, latest):
        if not installed or not latest:
            return "unknown"
        if installed in ("unknown", "—", "-", "HEAD", "main"):
            return "unknown"
        if is_wildcard(installed):
            return "wildcard"
        i, l = semver_key(installed), semver_key(latest)
        if i < l:   return "outdated"
        if i == l:  return "up-to-date"
        return "newer"
    
    # ---------------------------------------------------------------------------
    # ArgoCD Applications
    # ---------------------------------------------------------------------------
    
    def get_argocd_apps():
        """
        Liest alle ArgoCD Apps und liefert für jede eine dict mit:
          name, helm_sources (list of {chart, repo_url, revision}), sync_status, health_status
        Erkennt sowohl Single-Source als auch Multi-Source Apps automatisch.
        """
        out = run(["kubectl", "get", "applications", "-n", "argocd", "-o", "json"])
        if not out:
            return []
    
        data = json.loads(out)
        apps = []
        for item in data.get("items", []):
            name          = item["metadata"]["name"]
            sync_status   = item.get("status", {}).get("sync", {}).get("status", "Unknown")
            health_status = item.get("status", {}).get("health", {}).get("status", "Unknown")
    
            helm_sources = []
    
            # Single-source
            src = item["spec"].get("source")
            if src and src.get("chart"):
                helm_sources.append({
                    "chart":    src["chart"],
                    "repo_url": src["repoURL"],
                    "revision": src.get("targetRevision", "unknown"),
                })
    
            # Multi-source
            for src in item["spec"].get("sources", []):
                if src.get("chart"):
                    helm_sources.append({
                        "chart":    src["chart"],
                        "repo_url": src["repoURL"],
                        "revision": src.get("targetRevision", "unknown"),
                    })
    
            apps.append({
                "name":          name,
                "helm_sources":  helm_sources,
                "sync_status":   sync_status,
                "health_status": health_status,
                "is_helm":       len(helm_sources) > 0,
                "is_kustomize_only": name in KUSTOMIZE_ONLY_APPS or len(helm_sources) == 0,
            })
    
        return sorted(apps, key=lambda a: a["name"])
    
    # ---------------------------------------------------------------------------
    # Helm index
    # ---------------------------------------------------------------------------
    
    _helm_index_cache = {}
    
    def helm_fetch_index(repo_url):
        if repo_url not in _helm_index_cache:
            raw = http_get(repo_url.rstrip("/") + "/index.yaml")
            _helm_index_cache[repo_url] = yaml.safe_load(raw) if raw else None
        return _helm_index_cache[repo_url]
    
    
    def helm_latest_stable(chart_name, repo_url):
        index = helm_fetch_index(repo_url)
        if not index:
            return None, None
        entries = index.get("entries", {}).get(chart_name, [])
        if not entries:
            # Fallback: case-insensitive suche
            for key in index.get("entries", {}):
                if key.lower() == chart_name.lower():
                    entries = index["entries"][key]
                    break
        stable = [e for e in entries
                  if not re.search(r'(alpha|beta|rc|dev|pre|snapshot|\.ea[\.\d]|-ea[\.\d])', e.get("version", ""), re.I)]
        if not stable:
            stable = entries
        if not stable:
            return None, None
        stable.sort(key=lambda e: semver_key(e.get("version", "0")), reverse=True)
        best = stable[0]
        return best.get("version"), best.get("appVersion", "-")
    
    # ---------------------------------------------------------------------------
    # GitHub releases
    # ---------------------------------------------------------------------------
    
    def github_latest_release(repo):
        raw = http_get(f"https://api.github.com/repos/{repo}/releases?per_page=50")
        if not raw:
            return None
        try:
            releases = json.loads(raw)
        except Exception:
            return None
        stable = []
        for rel in releases:
            if rel.get("prerelease") or rel.get("draft"):
                continue
            tag = rel.get("tag_name", "")
            if re.search(r'(alpha|beta|rc|dev|\.ea[\.\d]|-ea[\.\d])', tag, re.I):
                continue
            stable.append(tag)
        if not stable:
            return None
        stable.sort(key=semver_key, reverse=True)
        return stable[0]
    
    
    def k3s_node_version():
        return run(["kubectl", "get", "nodes", "-o",
                    "jsonpath={.items[0].status.nodeInfo.kubeletVersion}"], silent=True)
    
    
    def argocd_deployment_version():
        out = run(["kubectl", "get", "deployment", "argocd-server", "-n", "argocd",
                   "-o", "jsonpath={.spec.template.spec.containers[0].image}"], silent=True)
        if out:
            m = re.search(r':v?([\d.]+)$', out)
            if m:
                return "v" + m.group(1)
        return None
    
    
    def kubevirt_cr_version():
        return run(["kubectl", "get", "kubevirt", "-A",
                    "-o", "jsonpath={.items[0].status.observedKubeVirtVersion}"], silent=True)
    
    
    def cdi_cr_version():
        out = run(["kubectl", "get", "cdi", "-A",
                   "-o", "jsonpath={.items[0].status.observedVersion}"], silent=True)
        return ("v" + out.lstrip("v")) if out else None
    
    
    EXTRACTORS = {
        "k3s_node_version":          k3s_node_version,
        "argocd_deployment_version": argocd_deployment_version,
        "kubevirt_cr_version":       kubevirt_cr_version,
        "cdi_cr_version":            cdi_cr_version,
    }
    
    # ---------------------------------------------------------------------------
    # Docker Hub
    # ---------------------------------------------------------------------------
    
    def dockerhub_latest(image):
        raw = http_get(f"https://hub.docker.com/v2/repositories/{image}/tags?page_size=50&ordering=last_updated")
        if not raw:
            return None
        candidates = [t["name"] for t in json.loads(raw).get("results", [])
                      if re.match(r'^\d+\.\d+\.\d+$', t.get("name", ""))]
        if not candidates:
            return None
        candidates.sort(key=semver_key, reverse=True)
        return candidates[0]
    
    
    def get_deployed_tag(namespace, deployment, container):
        out = run(["kubectl", "get", "deployment", deployment, "-n", namespace,
                   "-o", f"jsonpath={{.spec.template.spec.containers[?(@.name=='{container}')].image}}"],
                  silent=True)
        if out:
            parts = out.rsplit(":", 1)
            return parts[1] if len(parts) == 2 else None
        return None
    
    # ---------------------------------------------------------------------------
    # HTML
    # ---------------------------------------------------------------------------
    
    STATE_CSS   = {"outdated": "outdated", "up-to-date": "ok", "newer": "newer",
                   "wildcard": "wildcard", "unknown": "unknown", "git": "git"}
    STATE_BADGE = {"outdated":   "&#9888; Veraltet",
                   "up-to-date": "&#10003; Aktuell",
                   "newer":      "&#8593; Neuer",
                   "wildcard":   "&#126; Wildcard",
                   "unknown":    "? Unbekannt",
                   "git":        "&#128194; Git/Kustomize"}
    STATE_ICON  = {"outdated": "⚠", "up-to-date": "✓", "newer": "↑",
                   "wildcard": "~", "unknown": "?", "git": "G"}
    
    
    def row_html(label, source, installed, latest, extra, state):
        cls   = STATE_CSS.get(state, "unknown")
        badge = STATE_BADGE.get(state, "?")
        return (f'<tr class="{cls}"><td><b>{label}</b></td><td>{source}</td>'
                f'<td>{installed or "—"}</td><td>{latest or "—"}</td>'
                f'<td>{extra}</td><td><span class="badge">{badge}</span></td></tr>')
    
    
    def build_html(sections):
        now      = datetime.now().strftime("%d.%m.%Y %H:%M")
        all_html = "".join(r for _, rows in sections for r in rows)
        total    = all_html.count("<tr class=")
        outdated = all_html.count('<tr class="outdated"')
        unknown  = all_html.count('<tr class="unknown"')
        color    = "#e74c3c" if outdated else "#27ae60"
        summary  = (f"<span style='color:{color}'><b>{outdated} veraltet</b></span>"
                    if outdated else "<span style='color:#27ae60'><b>Alle aktuell</b></span>")
    
        body = ""
        for heading, rows in sections:
            anchor = re.sub(r'[^a-z0-9]', '_', heading.lower())
            body += (f'<h3 id="{anchor}">{heading}</h3>'
                     f'<table><thead><tr>'
                     f'<th>Komponente</th><th>Quelle</th>'
                     f'<th>Installiert</th><th>Verfügbar</th>'
                     f'<th>Info</th><th>Stand</th>'
                     f'</tr></thead><tbody>{"".join(rows)}</tbody></table><br>')
    
        css = """
    body{font-family:Arial,sans-serif;font-size:14px;color:#333}
    h2{color:#2c3e50}h3{color:#34495e;margin-top:24px}
    table{border-collapse:collapse;width:100%}
    th{background:#2c3e50;color:white;padding:8px 12px;text-align:left}
    td{padding:7px 12px;border-bottom:1px solid #ddd}
    tr.ok td{background:#eafaf1}
    tr.outdated td{background:#fdedec}
    tr.newer td{background:#fef9e7}
    tr.wildcard td{background:#eaf3fb}
    tr.git td{background:#f5f5f5;color:#666}
    tr.unknown td{background:#f8f9fa;color:#888}
    .badge{font-weight:bold}
    tr.outdated .badge{color:#c0392b}
    tr.ok .badge{color:#27ae60}
    tr.newer .badge{color:#e67e22}
    tr.wildcard .badge{color:#2980b9}
    tr.git .badge{color:#888}
    tr.unknown .badge{color:#95a5a6}
    .footer{margin-top:20px;font-size:12px;color:#aaa}
    """
        return f"""<!DOCTYPE html><html><head><meta charset="utf-8"><style>{css}</style></head><body>
    <h2>&#128202; Homelab Versions-Report</h2>
    <div>Stand: <b>{now}</b> &nbsp;|&nbsp; Gesamt: <b>{total}</b> &nbsp;|&nbsp; {summary}
    {f" &nbsp;|&nbsp; <span style='color:#888'>{unknown} unbekannt</span>" if unknown else ""}
    </div><br>{body}
    <div class="footer">homelab-version-checker v3 &middot; k3s reckeweg.io</div>
    </body></html>""", outdated
    
    
    def send_mail(html, outdated):
        pw = open(GMAIL_PWD_FILE).read().strip()
        icon    = "🔴" if outdated else "✅"
        subject = f"[Homelab] {icon} Versions-Report: {outdated} veraltet"
        msg = MIMEMultipart("alternative")
        msg["Subject"], msg["From"], msg["To"] = subject, SMTP_FROM, SMTP_TO
        msg.attach(MIMEText(html, "html", "utf-8"))
        with smtplib.SMTP(SMTP_HOST, SMTP_PORT) as s:
            s.ehlo(); s.starttls(); s.login(SMTP_FROM, pw)
            s.sendmail(SMTP_FROM, [SMTP_TO], msg.as_string())
        print(f"[OK] Sent: {subject}")
    
    # ---------------------------------------------------------------------------
    # main
    # ---------------------------------------------------------------------------
    
    def main():
        sections = []
    
        # ------------------------------------------------------------------
        # 1. ArgoCD Applications
        # ------------------------------------------------------------------
        print("[1/3] ArgoCD Applications...")
        apps = get_argocd_apps()
    
        helm_rows      = []
        kustomize_rows = []
    
        for app in apps:
            name          = app["name"]
            sync          = app["sync_status"]
            health        = app["health_status"]
            health_icon   = {"Healthy": "✓", "Degraded": "✗", "Progressing": "⟳"}.get(health, "?")
    
            if app["is_helm"] and not app["is_kustomize_only"]:
                for src in app["helm_sources"]:
                    chart    = src["chart"]
                    repo_url = src["repo_url"]
                    revision = src["revision"]
    
                    latest_ver, latest_app = helm_latest_stable(chart, repo_url)
                    state = compare(revision, latest_ver)
    
                    extra = f"Chart: {chart} | {health_icon} {health} | {sync}"
                    helm_rows.append(row_html(name, repo_url, revision, latest_ver, extra, state))
                    icon = STATE_ICON.get(state, "?")
                    print(f"  {icon}  {name:35s} {revision:15s} → {latest_ver or '?':15s} [{state}]")
            else:
                # Git/Kustomize App – nur Status
                extra = f"{health_icon} {health} | {sync}"
                kustomize_rows.append(row_html(name, "Git/Kustomize", "—", "—", extra, "git"))
                print(f"  G  {name:35s} {sync} / {health}")
    
        sections.append(("ArgoCD Apps – Helm Charts", helm_rows))
        sections.append(("ArgoCD Apps – Git/Kustomize (kein Versionsvergleich)", kustomize_rows))
    
        # ------------------------------------------------------------------
        # 2. System-Komponenten via GitHub
        # ------------------------------------------------------------------
        print("[2/3] GitHub Systemkomponenten...")
        gh_rows = []
        for key, cfg in GITHUB_COMPONENTS.items():
            installed = EXTRACTORS[cfg["get_version"]]()
            latest    = github_latest_release(cfg["repo"])
            inst_cmp  = re.sub(r'\+.*$', '', installed) if installed else None
            state     = compare(inst_cmp, latest)
            gh_rows.append(row_html(cfg["label"], "GitHub Releases",
                                    installed or "—", latest, cfg["repo"], state))
            print(f"  {STATE_ICON.get(state,'?')}  {cfg['label']:40s} {str(installed):20s} → {latest or '?'}")
        sections.append(("System-Komponenten (GitHub)", gh_rows))
    
        # ------------------------------------------------------------------
        # 3. Docker Hub Images
        # ------------------------------------------------------------------
        print("[3/3] Docker Hub Images...")
        dh_rows = []
        for key, cfg in DOCKERHUB_IMAGES.items():
            installed = get_deployed_tag(cfg["namespace"], cfg["deployment"], cfg["container"])
            latest    = dockerhub_latest(cfg["image"])
            state     = compare(installed, latest)
            dh_rows.append(row_html(cfg["label"], "Docker Hub",
                                    installed or "—", latest, cfg["image"], state))
            print(f"  {STATE_ICON.get(state,'?')}  {cfg['label']:40s} {str(installed):15s} → {latest or '?'}")
        sections.append(("Container Images (Docker Hub)", dh_rows))
    
        print("[*] Building report & sending mail...")
        html, outdated = build_html(sections)
        send_mail(html, outdated)
    
    
    if __name__ == "__main__":
        main()

---
# ------------------------------------------------------------
# 5. CronJob – jeden Montag 07:00 Uhr Europe/Berlin
# ------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-version-checker
  namespace: monitoring
  labels:
    app: homelab-version-checker
spec:
  schedule: "0 5 * * 1"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: homelab-version-checker
          restartPolicy: OnFailure

          # GMKTec Master-Nodes sind amd64 – bitnami/kubectl läuft nur auf amd64
          nodeSelector:
            kubernetes.io/arch: amd64

          # Masters haben den control-plane Taint – tolerieren damit der Job dort laufen darf
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

          initContainers:
            - name: copy-helm
              image: alpine/helm:3.14.4
              command: ["sh", "-c", "cp /usr/bin/helm /shared/helm && chmod +x /shared/helm && echo 'helm copied.'"]
              volumeMounts:
                - name: shared-bin
                  mountPath: /shared

            - name: copy-kubectl
              image: bitnami/kubectl:latest
              command: ["sh", "-c", "cp /opt/bitnami/kubectl/bin/kubectl /shared/kubectl && chmod +x /shared/kubectl && echo 'kubectl copied.'"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: shared-bin
                  mountPath: /shared

          containers:
            - name: checker
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  pip install --quiet pyyaml && \
                  python /scripts/check-versions.py
              env:
                - name: PATH
                  value: "/shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                - name: SMTP_FROM
                  value: "achim.reckeweg@gmail.com"
                - name: SMTP_TO
                  value: "achim.reckeweg@gmail.com"
                - name: GMAIL_PWD_FILE
                  value: "/etc/alertmanager/secrets/alertmanager-credentials/gmail-password"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: shared-bin
                  mountPath: /shared
                - name: alertmanager-credentials
                  mountPath: /etc/alertmanager/secrets/alertmanager-credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          volumes:
            - name: script
              configMap:
                name: homelab-version-checker-script
                defaultMode: 0755
            - name: shared-bin
              emptyDir: {}
            - name: alertmanager-credentials
              secret:
                secretName: alertmanager-credentials

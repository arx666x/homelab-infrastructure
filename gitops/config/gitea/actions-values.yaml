# =============================================================================
# Gitea Actions (act-runner) Helm Values - SERI Homelab
# Chart: gitea/actions v0.1.0
# https://gitea.com/gitea/helm-actions
# =============================================================================
#
# kubectl create secret generic gitea-actions-secret \
#  --from-literal=token=<runner token> \
#   --namespace gitea \
#  --dry-run=client -o yaml | \
# kubeseal --controller-namespace kube-system \
#  --controller-name sealed-secrets-controller \
#  --format yaml > /tmp/sealed-gitea-actions-secret.yaml
# 
# You grab the runner token from the gitea admin interface.
#  cp /tmp/sealed-gitea-actions-secret.yaml gitops/config/gitea/actions/sealed-gitea-actions-secret.yaml 
# and push 
#
enabled: true

existingSecret: "gitea-actions-secret"
existingSecretKey: "token"

giteaRootURL: "http://gitea-http.gitea.svc.cluster.local:3000"

statefulset:
  replicas: 1
  timezone: Europe/Berlin

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

  persistence:
    size: 1Gi
    storageClass: longhorn

  actRunner:
    registry: docker.gitea.com
    repository: act_runner
    tag: "0.3.1"
    pullPolicy: IfNotPresent
    config: |
      log:
        level: info
      cache:
        enabled: false
      container:
        require_docker: true
        docker_timeout: 300s

  dind:
    registry: docker.io
    repository: docker
    tag: "29.4.0-dind"
    pullPolicy: IfNotPresent



enabled: true
existingSecret: gitea-actions-secret
existingSecretKey: token
giteaRootURL: https://gitea.reckeweg.io
statefulset:
  replicas: 1
  timezone: Europe/Berlin
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 6Gi
  runner:
    registry: docker.io
    repository: gitea/act_runner
    tag: "nightly"
    config: |
      log:
        level: info
      cache:
        enabled: false
      runner:
        labels:
          - "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04"
          - "ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
          - "ubuntu-20.04:docker://catthehacker/ubuntu:act-20.04"
      container:
        require_docker: true
        docker_timeout: 300s
  dind:
    extraEnvs:
      - name: DOCKER_IPTABLES_LEGACY
        value: "1"

# =============================================================================
# PostgreSQL für ChromeIQ - SERI Homelab
# Eigene, dedizierte Instanz (nicht die Gitea- oder SERI-konsolidierte Postgres-
# Instanz) - Begründung: siehe ChromeIQ-Konzeptdokument, Abschnitt 4.1
# (Isolation von transienten/gemeinsam genutzten Umgebungen).
# Postgres 18 bewusst statt 16/17 (wie Gitea/SERI): neue, datenlose Instanz,
# kein Upgrade-Risiko, moderneres async-I/O-Subsystem.
# Layout an gitops/config/gitea/postgresql/postgresql-manifests.yaml angelehnt.
# =============================================================================

---
# Secret wird extern angelegt via gitops/sealed-secrets/seal-all-secrets.sh
# Referenz: chromeiq-postgresql-secret
#   Keys: postgres-password (superuser), password (chromeiq user)

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromeiq-postgresql
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: database
spec:
  serviceName: chromeiq-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: chromeiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: chromeiq
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: chromeiq
            - name: POSTGRES_USER
              value: chromeiq
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-postgresql-secret
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8"
          volumeMounts:
            # Postgres 18's image refuses to start if a volume is mounted at
            # the legacy /var/lib/postgresql/data path with a custom PGDATA
            # subdirectory (the pattern gitea-postgresql/16-alpine uses) -
            # found by running this locally via docker-compose first. Mount
            # the parent instead and let the image manage its own
            # version-specific subdirectory (pg_ctlcluster-style,
            # docker-library/postgres#1259).
            - name: data
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U chromeiq -d chromeiq -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U chromeiq -d chromeiq -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: "1"
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          "helm.sh/resource-policy": keep
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi

---
# ClusterIP Service - fuer den (spaeteren) Go-Backend-Zugriff in-cluster
apiVersion: v1
kind: Service
metadata:
  name: chromeiq-postgresql
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq

---
# Headless Service fuer StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: chromeiq-postgresql-headless
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq

---
# LoadBalancer (MetalLB) - der ChromeIQ-Crawler laeuft bewusst auf dem
# Speicher-Host (Musicbox), also ausserhalb des Clusters, und muss diese
# Instanz ueber das LAN erreichen (s. Konzeptdokument Abschnitt 3.1/6).
# Keine feste IP angefordert - MetalLB vergibt automatisch aus default-pool.
apiVersion: v1
kind: Service
metadata:
  name: chromeiq-postgresql-lb
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: database
spec:
  type: LoadBalancer
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: chromeiq

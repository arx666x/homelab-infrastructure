apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgresql.yaml
  - typesense.yaml
  # sealed-postgresql-secret.yaml und sealed-typesense-secret.yaml erst
  # aufnehmen, nachdem gitops/sealed-secrets/seal-all-secrets.sh gelaufen ist
  # und die Platzhalter durch echte SealedSecrets ersetzt hat - siehe die
  # Kommentare in diesen beiden Dateien. Ohne echte Secrets bleiben Postgres/
  # Typesense sonst im CrashLoop (POSTGRES_PASSWORD/TYPESENSE_API_KEY fehlen).

# =============================================================================
# ciq-embed-svc - always-on text-embedding service for Mood-Suche's
# Freitext seed type (ChromeIQ docs/audio-embeddings-mood-search.md Phase
# 4). Runs ciq-embed's "embed-serve" mode (same image as the Musicbox-
# adjacent "embed-batch" backfill job, different command) - loads only the
# CLAP text encoder, no music mount, no Postgres connection, just
# POST /embed-text called internally by ciq-backend (internal/embedsvc).
# ClusterIP only, never exposed via Ingress - not meant to be reachable
# from outside the cluster.
#
# Known gap (not blocking first rollout, flagged for a follow-up): the
# ~1.9GB CLAP checkpoint is downloaded fresh from Hugging Face on every
# pod start (laion_clap's own on-disk cache lives in the container's
# ephemeral filesystem, no PVC mounted for it here) - a restart costs
# several minutes before the pod becomes ready again, not just a quick
# reload. The startupProbe below is deliberately generous (up to ~10min)
# to tolerate this rather than crash-loop on a slow first boot.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciq-embed-svc
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: mood-search-text-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ciq-embed-svc
      app.kubernetes.io/instance: chromeiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ciq-embed-svc
        app.kubernetes.io/instance: chromeiq
        app.kubernetes.io/component: mood-search-text-embed
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
      containers:
        - name: ciq-embed-svc
          image: gitea.reckeweg.io/achim/ciq-embed:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["embed-serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {memory: 2Gi, cpu: 250m}
            limits: {memory: 3Gi, cpu: "2"}

---
apiVersion: v1
kind: Service
metadata:
  name: ciq-embed-svc
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: mood-search-text-embed
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq

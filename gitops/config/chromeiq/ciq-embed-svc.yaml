# =============================================================================
# ciq-embed-svc - always-on text-embedding service for Mood-Suche's
# Freitext seed type (ChromeIQ docs/tag-based-similarity-search.md §9).
# Runs ciq-embed's "embed-serve" mode (same image as the Musicbox-
# adjacent "embed-batch"/"embed-tags" one-shot jobs, different command) -
# no music mount, no Postgres connection, just POST /embed-tag-query
# (multilingual-e5-small, always loaded) called internally by
# ciq-backend (internal/embedsvc). ClusterIP only, never exposed via
# Ingress - not meant to be reachable from outside the cluster.
#
# CLAP (POST /embed-text) is NOT loaded by default as of image 0.2.0 -
# gated behind CIQ_EMBED_CLAP_ENABLED (unset here = off), since the CLAP
# text axis was found defective and stopped (docs §1/§12: "gestoppt
# bleibt gestoppt, bis die Tag-Achse messbar ist"). Set that env var
# explicitly here if the CLAP axis is ever revived.
#
# Known gap (not blocking, flagged for a follow-up): the tag-query
# model (~470MB, smaller than CLAP's former ~1.9GB) is still downloaded
# fresh from Hugging Face on every pod start - no PVC mounted for
# Hugging Face's on-disk cache. The startupProbe below is deliberately
# generous (up to ~10min) to tolerate a slow first boot rather than
# crash-loop on it.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciq-embed-svc
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: mood-search-text-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ciq-embed-svc
      app.kubernetes.io/instance: chromeiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ciq-embed-svc
        app.kubernetes.io/instance: chromeiq
        app.kubernetes.io/component: mood-search-text-embed
    spec:
      affinity:
        nodeAffinity:
          # Required, not just preferred: the image is amd64-only as of
          # 0.2.3 (.gitea/workflows/ciq-embed-build-and-push.yml - arm64
          # dropped from the build matrix, QEMU emulation made
          # torch/torchvision installation impractically slow there). A
          # soft preference would still let the scheduler place this pod
          # on an arm64 node under pressure, where it would crash-loop on
          # an exec-format error instead of just running on a "less
          # preferred" node - this needs to be a hard constraint now.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
      containers:
        - name: ciq-embed-svc
          image: gitea.reckeweg.io/achim/ciq-embed:0.2.3
          imagePullPolicy: IfNotPresent
          args: ["embed-serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {memory: 2Gi, cpu: 250m}
            limits: {memory: 3Gi, cpu: "2"}

---
apiVersion: v1
kind: Service
metadata:
  name: ciq-embed-svc
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: mood-search-text-embed
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: ciq-embed-svc
    app.kubernetes.io/instance: chromeiq

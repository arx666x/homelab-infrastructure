# =============================================================================
# ciq-backend - ChromeIQ's JSON API (musik-inventarisierung-konzept.md
# 3.4). Talks to chromeiq-postgresql/chromeiq-typesense via in-cluster
# ClusterIP DNS (not the external *-lb Services, which stay reserved for
# the crawler running on the Musicbox outside the cluster), and reads
# cover/review/lyrics files from the SMB-backed, read-only music mount
# (see smb-pv.yaml). Since the Playlist feature, it also gets a second,
# read-write SMB mount (//musicbox/playlists) - the only part of the
# catalog ciq-backend itself writes back to disk, kept on its own share
# so the music mount's read-only guarantee stays untouched.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciq-backend
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ciq-backend
      app.kubernetes.io/instance: chromeiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ciq-backend
        app.kubernetes.io/instance: chromeiq
        app.kubernetes.io/component: api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
      containers:
        - name: ciq-backend
          image: gitea.reckeweg.io/achim/ciq-backend:1.1.21
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Achims Findings (2026-08-03/04): Postgres+Typesense moved off
            # the in-cluster Longhorn-backed instances onto the Musicbox
            # (repeated Longhorn checkpoint I/O stalls under crawler write
            # load, see project memory). Same chromeiq DB user/password and
            # Typesense API key as before - only the host moved, secrets
            # below are unchanged and still correct.
            - name: CIQ_BACKEND_POSTGRES_HOST
              value: "ciq-db.reckeweg.io"
            - name: CIQ_BACKEND_POSTGRES_DB
              value: "chromeiq"
            - name: CIQ_BACKEND_POSTGRES_USER
              value: "chromeiq"
            - name: CIQ_BACKEND_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-postgresql-secret
                  key: password
            - name: CIQ_BACKEND_TYPESENSE_URL
              value: "http://ciq-search.reckeweg.io:8108"
            - name: CIQ_BACKEND_TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-typesense-secret
                  key: api-key
            - name: CIQ_BACKEND_CORS_ORIGIN
              value: "https://ciq.reckeweg.io"
            - name: CIQ_BACKEND_MUSIC_ROOT
              value: "/music"
            - name: CIQ_BACKEND_PLAYLISTS_ROOT
              value: "/playlists"
            - name: CIQ_BACKEND_LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-lastfm-secret
                  key: api-key
            # Subsonic-compatible REST API (architecture.md 3.7/8, roadmap
            # Phase 4) - opens SonoPhone/SonoPad/Substreamer against
            # ciq-backend directly instead of Navidrome+bonob. HOLD POINT
            # (2026-08-05): migrations 0016/0017 (subsonic_users table +
            # supporting indexes) are ciq-crawler-owned and only applied on
            # its *next* startup - do not `argocd app sync chromeiq` with
            # this block active until that has happened, or every Subsonic
            # login attempt 500s until the table exists (the backend itself
            # stays up either way, s. main.go's non-fatal bootstrap
            # handling - just the feature is unusable until then).
            - name: CIQ_BACKEND_SUBSONIC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: encryption-key
            - name: CIQ_BACKEND_SUBSONIC_USER
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: username
            - name: CIQ_BACKEND_SUBSONIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: password
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
            - name: playlists
              mountPath: /playlists
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {memory: 512Mi, cpu: 500m}
            limits: {memory: 1Gi, cpu: "1"}
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: chromeiq-musicbox-music
            readOnly: true
        - name: playlists
          persistentVolumeClaim:
            claimName: chromeiq-musicbox-playlists

---
apiVersion: v1
kind: Service
metadata:
  name: ciq-backend
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ciq-api-tls
  namespace: chromeiq
spec:
  secretName: ciq-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ciq-api.reckeweg.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ciq-backend
  namespace: chromeiq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ciq-api.reckeweg.io]
      secretName: ciq-api-tls
  rules:
    - host: ciq-api.reckeweg.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ciq-backend
                port:
                  number: 8080

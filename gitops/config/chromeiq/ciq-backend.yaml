# =============================================================================
# ciq-backend - ChromeIQ's JSON API (musik-inventarisierung-konzept.md
# 3.4). Talks to chromeiq-postgresql/chromeiq-typesense via in-cluster
# ClusterIP DNS (not the external *-lb Services, which stay reserved for
# the crawler running on the Musicbox outside the cluster), and reads
# cover/review/lyrics files from the SMB-backed, read-only music mount
# (see smb-pv.yaml). Since the Playlist feature, it also gets a second,
# read-write SMB mount (//musicbox/playlists) - the only part of the
# catalog ciq-backend itself writes back to disk, kept on its own share
# so the music mount's read-only guarantee stays untouched.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciq-backend
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ciq-backend
      app.kubernetes.io/instance: chromeiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ciq-backend
        app.kubernetes.io/instance: chromeiq
        app.kubernetes.io/component: api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
      containers:
        - name: ciq-backend
          image: gitea.reckeweg.io/achim/ciq-backend:1.1.70
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Achims Findings (2026-08-03/04): Postgres+Typesense moved off
            # the in-cluster Longhorn-backed instances onto the Musicbox
            # (repeated Longhorn checkpoint I/O stalls under crawler write
            # load, see project memory). Same chromeiq DB user/password and
            # Typesense API key as before - only the host moved, secrets
            # below are unchanged and still correct.
            - name: CIQ_BACKEND_POSTGRES_HOST
              value: "ciq-db.reckeweg.io"
            - name: CIQ_BACKEND_POSTGRES_DB
              value: "chromeiq"
            - name: CIQ_BACKEND_POSTGRES_USER
              value: "chromeiq"
            - name: CIQ_BACKEND_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-postgresql-secret
                  key: password
            - name: CIQ_BACKEND_TYPESENSE_URL
              value: "http://ciq-search.reckeweg.io:8108"
            - name: CIQ_BACKEND_TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-typesense-secret
                  key: api-key
            - name: CIQ_BACKEND_CORS_ORIGIN
              value: "https://ciq.reckeweg.io"
            - name: CIQ_BACKEND_MUSIC_ROOT
              value: "/music"
            - name: CIQ_BACKEND_PLAYLISTS_ROOT
              value: "/playlists"
            # UI-triggered imports (docs/album-track-ratings.md §9.5/§9.6,
            # Achim's request 2026-08-18) - RS-Notes export JSONs live on
            # their own small RW SMB share (smb-pv.yaml), not in git
            # (personal raw data); the Discogs token authenticates
            # cmd/discogsimport's shared logic when triggered from the
            # Profile page instead of the CLI.
            # HOLD POINT (same pattern as the Subsonic/auth blocks below):
            # migration 0040 (import_runs) is ciq-crawler-owned and only
            # applied on its *next* startup - until Achim manually bumps
            # the TrueNAS crawler app to ciq-crawler:1.1.49, both Import
            # buttons on the Profile page 500 (the rest of the backend
            # stays up fine, s. main.go's non-fatal bootstrap handling
            # precedent). Also needs the //musicbox/rsnotes SMB share to
            # actually exist (Achim's manual TrueNAS step, s. smb-pv.yaml)
            # before the RS-Notes button specifically becomes usable.
            - name: CIQ_BACKEND_RS_NOTES_DIR
              value: "/rsnotes"
            - name: CIQ_BACKEND_DISCOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chromeiq-discogs-secret
                  key: token
            - name: CIQ_BACKEND_LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-lastfm-secret
                  key: api-key
            # Mood-Suche Freitext-Suche (docs/audio-embeddings-mood-search.md
            # Phase 4) - in-cluster ClusterIP short DNS, same namespace as
            # this Deployment. Empty/unreachable degrades cleanly (main.go's
            # embedSvcURL is nil-safe like lastfmAPIKey - handleMoodSearch's
            # text-seed path returns an empty result instead of erroring).
            - name: CIQ_BACKEND_EMBED_SVC_URL
              value: "http://ciq-embed-svc:8000"
            # Subsonic-compatible REST API (architecture.md 3.7/8, roadmap
            # Phase 4) - opens SonoPhone/SonoPad/Substreamer against
            # ciq-backend directly instead of Navidrome+bonob. HOLD POINT
            # (2026-08-05): migrations 0016/0017 (subsonic_users table +
            # supporting indexes) are ciq-crawler-owned and only applied on
            # its *next* startup - do not `argocd app sync chromeiq` with
            # this block active until that has happened, or every Subsonic
            # login attempt 500s until the table exists (the backend itself
            # stays up either way, s. main.go's non-fatal bootstrap
            # handling - just the feature is unusable until then).
            - name: CIQ_BACKEND_SUBSONIC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: encryption-key
            - name: CIQ_BACKEND_SUBSONIC_USER
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: username
            - name: CIQ_BACKEND_SUBSONIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-subsonic-secret
                  key: password
            # Local user management + auth (konzeptdokument 3.9, decision
            # 2026-08-09) - JWT signing key for the app's own session
            # tokens, and SMTP relay for password-reset mail. Same
            # HOLD POINT pattern as the Subsonic block above: migration
            # 0024_users_and_scopes is ciq-crawler-owned and only applied
            # on its *next* startup, and none of this is wired up in any
            # ciq-backend image built/deployed so far - these env vars are
            # inert until an image containing the auth code is actually
            # rolled out. SMTP reuses the same Gmail app password already
            # sealed for Alertmanager (gitops/config/monitoring), with the
            # correct username - the monitoring secret's own "gmail-user"
            # key has a stray trailing ">" and was never actually used
            # there (Alertmanager's config hardcodes the username instead),
            # not copied here.
            - name: CIQ_BACKEND_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chromeiq-jwt-secret
                  key: secret
            - name: CIQ_BACKEND_PUBLIC_BASE_URL
              value: "https://ciq.reckeweg.io"
            - name: CIQ_BACKEND_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: chromeiq-smtp-secret
                  key: host
            - name: CIQ_BACKEND_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: chromeiq-smtp-secret
                  key: port
            - name: CIQ_BACKEND_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: chromeiq-smtp-secret
                  key: username
            - name: CIQ_BACKEND_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-smtp-secret
                  key: password
            - name: CIQ_BACKEND_SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: chromeiq-smtp-secret
                  key: from-address
            - name: CIQ_BACKEND_SMTP_TLS
              value: "starttls"
            # Idempotent bootstrap admin (internal/api/auth.go main.go
            # startup) - without this, the users table stays empty and
            # nobody (including Achim) can log in once every route requires
            # a scope. Only creates the row if it doesn't already exist -
            # safe to leave in place across restarts; change the password
            # via the User-Management UI after first login, this env var
            # is not re-applied to an existing row.
            - name: CIQ_BACKEND_BOOTSTRAP_ADMIN_LOGIN
              valueFrom:
                secretKeyRef:
                  name: chromeiq-bootstrap-admin-secret
                  key: login
            - name: CIQ_BACKEND_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chromeiq-bootstrap-admin-secret
                  key: password
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
            - name: playlists
              mountPath: /playlists
            - name: rsnotes
              mountPath: /rsnotes
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {memory: 512Mi, cpu: 500m}
            limits: {memory: 1Gi, cpu: "1"}
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: chromeiq-musicbox-music
            readOnly: true
        - name: playlists
          persistentVolumeClaim:
            claimName: chromeiq-musicbox-playlists
        - name: rsnotes
          persistentVolumeClaim:
            claimName: chromeiq-musicbox-rsnotes

---
apiVersion: v1
kind: Service
metadata:
  name: ciq-backend
  namespace: chromeiq
  labels:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: ciq-backend
    app.kubernetes.io/instance: chromeiq

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ciq-api-tls
  namespace: chromeiq
spec:
  secretName: ciq-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ciq-api.reckeweg.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ciq-backend
  namespace: chromeiq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ciq-api.reckeweg.io]
      secretName: ciq-api-tls
  rules:
    - host: ciq-api.reckeweg.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ciq-backend
                port:
                  number: 8080

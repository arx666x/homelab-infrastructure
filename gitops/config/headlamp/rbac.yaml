---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    app.kubernetes.io/name: headlamp

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-admin
  labels:
    app.kubernetes.io/name: headlamp
  annotations:
    # Bewusst NICHT geloescht, obwohl Headlamp jetzt per OIDC statt per
    # ServiceAccount-Token einloggt (siehe headlamp-oidc-user-admin unten) -
    # der 1-Jahres-Token (headlamp-token.sh) bleibt als offline aufbewahrter
    # Notfallzugang gueltig, siehe SSO-Rollout-Plan "Break-Glass".
    note: "Offline break-glass access via long-lived ServiceAccount token, kept intentionally"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp

---
# Normaler Login-Pfad ab jetzt: OIDC-Nutzer statt ServiceAccount-Token.
# "oidc:" Prefix kommt vom --oidc-username-prefix=oidc: Flag auf dem
# k3s-apiserver. Claim ist "preferred_username" (Authentik-Username-Feld,
# hier "achim"), NICHT "email" - Kubernetes' OIDC-Authenticator verlangt
# bei --oidc-username-claim=email zusaetzlich einen wahren
# email_verified-Claim, den es ohne konfigurierten E-Mail-Verifizierungs-
# Flow (kein SMTP im Cluster) nie geben wird - live bestaetigt am
# 2026-07-26: "Unable to authenticate the request: oidc: email not
# verified". Betrifft jeden User, nicht nur diesen Account, daher der
# Wechsel des Claims statt eines Einzelfall-Workarounds. Siehe
# docs/headlamp-oidc-setup.md fuer die noetige k3s-apiserver-Flag-Aenderung
# auf allen drei Control-Plane-Nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-user-admin
  labels:
    app.kubernetes.io/name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: "oidc:achim"
    apiGroup: rbac.authorization.k8s.io

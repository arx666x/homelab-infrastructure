# =============================================================================
# Headlamp - Kubernetes UI
# mit Longhorn Plugin via Init-Container
# URL: https://headlamp.reckeweg.io
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101

      # =================================================================
      # Init-Container: Kopiert Plugin-Dateien in das geteilte
      # plugins-Volume, bevor Headlamp startet.
      #
      # Headlamp lädt Plugins beim Start aus -plugins-dir.
      # Das emptyDir-Volume vermittelt zwischen Init- und Hauptcontainer.
      #
      # Weitere Plugins: einfach zusätzliche initContainers ergänzen,
      # die alle auf dasselbe Volume mounten.
      # =================================================================
      initContainers:
        - name: install-longhorn-plugin
          image: ghcr.io/giantswarm/headlamp-longhorn:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo ">>> Kopiere Longhorn Plugin..."
              mkdir -p /headlamp/plugins/headlamp-longhorn
              cp -r /plugins/headlamp-longhorn/* /headlamp/plugins/headlamp-longhorn/
              echo ">>> Installierte Plugins:"
              ls -la /headlamp/plugins/
              echo ">>> Fertig."
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false

      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.40.1
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
          ports:
            - containerPort: 4466
              name: http
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins

      volumes:
        - name: plugins
          emptyDir: {}

      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - port: 80
      targetPort: 4466
      name: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-tls
  namespace: headlamp
spec:
  secretName: headlamp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - headlamp.reckeweg.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headlamp.reckeweg.io
      secretName: headlamp-tls
  rules:
    - host: headlamp.reckeweg.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

# =============================================================================
# Headlamp - Kubernetes UI
# mit Longhorn + Cert-Manager Plugin via Init-Container
# Longhorn Plugin: offizielles Plugin von Giant Swarm (github.com/giantswarm/headlamp-longhorn)
# Der :namespace-Route-Crash (Grund für den frueheren Fork) wurde in Headlamp
# selbst gefixt (PR kubernetes-sigs/headlamp#5679, ausgeliefert mit v0.43.0)
# URL: https://headlamp.reckeweg.io
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101

      initContainers:
        # -----------------------------------------------------------------
        # Plugin 1: Longhorn (offizielles Plugin, Giant Swarm)
        # https://github.com/giantswarm/headlamp-longhorn
        # -----------------------------------------------------------------
        - name: install-longhorn-plugin
          image: gsoci.azurecr.io/giantswarm/headlamp-longhorn:0.1.1
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo ">>> Installiere Longhorn Plugin..."
              mkdir -p /headlamp/plugins/headlamp-longhorn
              cp -r /plugins/headlamp-longhorn/* /headlamp/plugins/headlamp-longhorn/
              echo ">>> Longhorn Plugin installiert."
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false

        # -----------------------------------------------------------------
        # Plugin 2: Cert-Manager
        # -----------------------------------------------------------------
        - name: install-cert-manager-plugin
          image: ghcr.io/headlamp-k8s/headlamp-plugin-cert-manager:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo ">>> Installiere Cert-Manager Plugin..."
              cp -r /plugins/* /headlamp/plugins/
              echo ">>> Cert-Manager Plugin installiert."
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false

        # -----------------------------------------------------------------
        # Fix: Kopiere static-plugins aus dem Headlamp-Image ins Volume
        # Workaround fuer Headlamp v0.40.1 Bug - Static Plugins erscheinen
        # sonst nicht in der Sidebar
        # Die 404s fuer fehlende Locale-Dateien sind kosmetisch (fallback: en)
        # -----------------------------------------------------------------
        - name: fix-static-plugins
          image: ghcr.io/headlamp-k8s/headlamp:v0.43.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo ">>> Kopiere static-plugins aus Image..."
              cp -r /headlamp/static-plugins/. /static-plugins-init/
              echo ">>> Fertig."
          volumeMounts:
            - name: static-plugins
              mountPath: /static-plugins-init
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false

      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.43.0
          args:
            # -in-cluster entfernt: OIDC ersetzt den bisherigen statischen
            # Jahres-Token vollstaendig als Login-Mechanismus (siehe
            # docs/headlamp-oidc-setup.md - der k3s-apiserver braucht dafuer
            # zusaetzlich --oidc-*-Flags auf allen drei Control-Plane-Nodes,
            # das ist NICHT Teil dieser GitOps-Aenderung, siehe dortiges
            # Dokument fuer den manuellen Schritt).
            - "-plugins-dir=/headlamp/plugins"
            - "-oidc-client-id=headlamp"
            - "-oidc-idp-issuer-url=https://sso.reckeweg.io/application/o/headlamp/"
            - "-oidc-scopes=openid,profile,email,groups"
            # Session-Cookie 1 Jahr gueltig statt Default 24h - verfuegbar
            # seit v0.41.0. Weiterhin sinnvoll auch mit OIDC (weniger
            # Re-Logins), unabhaengig vom alten Jahres-Token.
            - "-session-ttl=31536000"
          env:
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc-secret
                  key: client_secret
          ports:
            - containerPort: 4466
              name: http
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: static-plugins
              mountPath: /headlamp/static-plugins

      volumes:
        - name: plugins
          emptyDir: {}
        - name: static-plugins
          emptyDir: {}

      nodeSelector:
        kubernetes.io/os: linux
        # ghcr.io/headlamp-k8s/headlamp-plugin-cert-manager hat kein arm64-
        # Manifest - live bestaetigt am 2026-07-26 (Pod auf k3s-02a/arm64
        # landete im Init:CrashLoopBackOff, "exec /bin/sh: exec format
        # error"). Hart pinnen statt nur bevorzugen, da es fuer diesen
        # Init-Container schlicht kein funktionierendes arm64-Image gibt.
        kubernetes.io/arch: amd64

---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - port: 80
      targetPort: 4466
      name: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-tls
  namespace: headlamp
spec:
  secretName: headlamp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - headlamp.reckeweg.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headlamp.reckeweg.io
      secretName: headlamp-tls
  rules:
    - host: headlamp.reckeweg.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

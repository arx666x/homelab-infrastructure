# =============================================================================
# kubernetes-mcp-server - Deployment + Service
# https://github.com/containers/kubernetes-mcp-server
# Read-only MCP-Server fuer Claude Desktop (Custom Connector via mcp-remote).
# Nutzt automatisch die in-cluster ServiceAccount-Config (kein Kubeconfig noetig).
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp-server
    spec:
      serviceAccountName: mcp-viewer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kubernetes-mcp-server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.63
          imagePullPolicy: IfNotPresent
          args:
            - "--port=8080"
            - "--read-only"
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  selector:
    app.kubernetes.io/name: kubernetes-mcp-server
  ports:
    - port: 80
      targetPort: 8080
      name: http

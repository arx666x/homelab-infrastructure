# =============================================================================
# kubernetes-mcp-server - Ingress + Traefik Middlewares
# Zugriff nur mit gueltigen Basic-Auth-Credentials (siehe sealed-mcp-basic-auth.yaml).
# Externe Erreichbarkeit ausserhalb des Heimnetzes nur ueber VPN.
# URL: https://k8s-mcp.reckeweg.io
# =============================================================================

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-basic-auth
  namespace: mcp
spec:
  basicAuth:
    secret: mcp-basic-auth

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-mcp-tls
  namespace: mcp
spec:
  secretName: k8s-mcp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - k8s-mcp.reckeweg.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: mcp-mcp-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - k8s-mcp.reckeweg.io
      secretName: k8s-mcp-tls
  rules:
    - host: k8s-mcp.reckeweg.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-mcp-server
                port:
                  number: 80

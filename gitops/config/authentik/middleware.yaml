# =============================================================================
# Authentik ForwardAuth-Gate - Traefik Middleware
#
# Referenziert von Apps ohne eigenes OIDC (Longhorn, Prometheus, HomeAssistant)
# per Annotation/Middlewares-Feld:
#   traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forward-auth@kubernetescrd
#
# Domain-Level-Modus (siehe blueprints-configmap.yaml, ProxyProvider mit
# mode: forward_domain, cookie_domain: reckeweg.io): EIN Login auf
# sso.reckeweg.io gilt fuer alle *.reckeweg.io-Subdomains. Jede so gegatete
# App braucht zusaetzlich zu dieser Middleware noch eine ungegatete Route
# fuer /outpost.goauthentik.io/ auf der eigenen Domain (siehe
# outpost-passthrough-ingressroute.yaml) - sonst kann der Login-Redirect
# nicht zurueck zur App-Domain abschliessen (offizielle Authentik-Doku zu
# "Forward auth (domain level)": nur /outpost.goauthentik.io wird je
# Anwendungs-Domain zum Outpost geroutet, der Rest bleibt bei der App).
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid

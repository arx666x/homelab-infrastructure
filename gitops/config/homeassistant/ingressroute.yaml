apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    # cert-manager erzeugt das Secret automatisch via Certificate-Ressource
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homeassistant.reckeweg.io`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    secretName: homeassistant-tls

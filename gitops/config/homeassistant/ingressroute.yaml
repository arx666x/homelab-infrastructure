apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    # cert-manager erzeugt das Secret automatisch via Certificate-Ressource
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  entryPoints:
    - websecure
  routes:
    # Authentik ForwardAuth-Gate - HomeAssistant hat kein OIDC-Login, das
    # sich deklarativ anbinden liesse. Braucht zusaetzlich die ungegatete
    # Outpost-Passthrough-Route, siehe
    # gitops/config/authentik/outpost-passthrough-ingressroute.yaml
    - match: Host(`homeassistant.reckeweg.io`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: authentik
      services:
        - name: homeassistant
          port: 8123
  tls:
    secretName: homeassistant-tls

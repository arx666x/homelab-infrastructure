apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    # cert-manager erzeugt das Secret automatisch via Certificate-Ressource
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  entryPoints:
    - websecure
  routes:
    # ForwardAuth-Gate entfernt (2026-07-27) - ersetzt durch natives OIDC
    # ueber die HACS-Komponente "hass-oidc-auth" (siehe
    # gitops/config/authentik/blueprints-configmap.yaml,
    # homeassistant-oidc.yaml). Beides gleichzeitig haette ein doppeltes
    # Login bedeutet.
    - match: Host(`homeassistant.reckeweg.io`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    secretName: homeassistant-tls

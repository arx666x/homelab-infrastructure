apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
spec:
  # 2026-09-01: Auf 0 gesetzt fuer den Umzug auf die diskstation.
  # Home Assistant laeuft dort als Container mit network_mode: host
  # (/volume2/docker/homeassistant). Der Cluster-Betrieb bleibt als
  # Rueckfallebene bestehen - die PVC steht auf Retain.
  # WICHTIG: Nicht wieder auf 1 setzen, solange der Container auf dem NAS
  # laeuft. Beide Instanzen wuerden gegen dieselbe PostgreSQL schreiben.
  # Details: Wiki-Seite Energie_HA-Umzug-Diskstation
  replicas: 0
  # Recreate: HA verträgt keinen parallelen Betrieb (SQLite-Lock auf /config)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      terminationGracePeriodSeconds: 60
      # Gepinnt auf gmkt-03x: die HomeMatic-CCU (192.168.11.60) lebt nur auf dem
      # mgmt-Netz 192.168.11.0/24 und hat keine Route ins k3s-Pod-Netz (10.42.0.0/16).
      # BidCos-RF braucht aber einen CCU->HA-Callback (siehe hostPort unten,
      # gebunden an gmkt-03x' mgmt_ip 192.168.11.33) - der muss auf einem festen,
      # von der CCU erreichbaren Node liegen. Bei Node-Wechsel muss hostIP/
      # callback_host in der homematicip_local-Integration mit angepasst werden.
      nodeSelector:
        kubernetes.io/hostname: gmkt-03x
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
            - containerPort: 51200
              hostPort: 51200
              hostIP: 192.168.11.33
              name: hmip-callback
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File

# =============================================================================
# Dediziertes SSH-Keypaar nur für den Image-Updater-Git-Write-back (nicht der
# bestehende ArgoCD-Sync-Key). Öffentlicher Schlüssel muss als SCHREIBFÄHIGER
# Deploy-Key im homelab-infrastructure-Repo hinterlegt werden (Gitea ->
# Repo -> Settings -> Deploy Keys -> Add Deploy Key, "Write access" ankreuzen):
#
#   ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK4XR+Zv/JE1IoBPPAuUbccsY0vn/Yhj73WJhGgiubfJ argocd-image-updater@homelab
#
# Rotation: neues Keypaar generieren, mit demselben Befehl wie unten neu
# versiegeln, alten Deploy-Key in Gitea löschen, neuen public Key eintragen.
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-image-updater-git-creds
  namespace: argocd
spec:
  encryptedData:
    sshPrivateKey: 
  template:
    metadata:
      name: argocd-image-updater-git-creds
      namespace: argocd

# =============================================================================
# Watches gitea.reckeweg.io/susann/redesign for new RC-/GA-Tags (siehe
# .gitea/workflows/build-and-push.yml im redesign-Repo) und rollt sie im
# Homelab aus, sobald ein neuer Tag erscheint - kein manueller Tag-Bump mehr
# in gitops/config/auditique/kustomization.yaml.
#
# newest-build statt semver: RC-x.x.x/GA-x.x.x ist kein echtes Semver, daher
# wird nach Push-Zeitpunkt in der Registry sortiert - der zuletzt gebaute
# RC- oder GA-Tag gewinnt. GA-Tags landen zusätzlich (über den Dual-Push nach
# GitHub) beim Web-Hoster, siehe .github/workflows/deploy.yml im redesign-Repo
# - das läuft komplett unabhängig vom Image Updater.
#
# Write-back per Git (nicht "argocd"): euer root-infrastructure App-of-Apps
# nutzt selfHeal: true, das würde eine "argocd"-Write-back-Änderung (die nur
# im Application-Objekt selbst landet, nicht in Git) beim nächsten Sync sofort
# wieder zurückdrehen. Git-Write-back committet stattdessen direkt in
# gitops/config/auditique/kustomization.yaml - danach sind Git und Cluster
# wieder deckungsgleich, kein Konflikt mit selfHeal.
#
# Git-Credentials: method "git" (ohne :secret:...) nutzt ArgoCDs eigene
# registrierte Repo-Credentials ("repocreds") fuer diese Repo-URL. Bewusst
# NICHT "git:secret:<eigener Key>": der eigene-Key-Pfad hat in
# argocd-image-updater v1.2.2 insecureIgnoreHostKey fest auf true verdrahtet
# (im Quellcode verifiziert, pkg/argocd/gitcreds.go - kein Config-Schalter
# dagegen) und ignoriert damit die eigentlich gemountete
# argocd-ssh-known-hosts-cm komplett. Der repocreds-Pfad respektiert dagegen
# das insecure-Flag des ArgoCD-Repository-Eintrags korrekt. Der ArgoCD-eigene
# Sync-Key wurde dafuer extra auf Schreibzugriff hochgestuft, siehe Abschnitt
# "Git-Write-back-Credential" in docs/argocd-image-updater.md.
# =============================================================================
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: auditique
  namespace: argocd
spec:
  writeBackConfig:
    method: "git"
    gitConfig:
      branch: main
      writeBackTarget: "kustomization"
  applicationRefs:
    - namePattern: "auditique"
      images:
        - alias: auditique-web
          imageName: gitea.reckeweg.io/susann/redesign
          commonUpdateSettings:
            updateStrategy: newest-build
            # (?i) - Go-Regex ist sonst case-sensitive; git tag RC-x.x.x wird
            # nicht zwingend genauso großgeschrieben gepusht (z.B. "rc-0.4.0"),
            # das soll trotzdem matchen.
            allowTags: "regexp:(?i)^(rc|ga)-"
            pullSecret: "pullsecret:argocd/gitea-registry-creds"

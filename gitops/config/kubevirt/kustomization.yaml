# Kustomize nutzt Remote-Base direkt von GitHub Releases
# Das ist der sauberste Weg fuer Operator-Manifeste die sich selten aendern
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # KubeVirt Operator (CRDs + Controller)
  - https://github.com/kubevirt/kubevirt/releases/download/v1.5.2/kubevirt-operator.yaml
  # KubeVirt CR (aktiviert den Operator)
  - kubevirt-cr.yaml
